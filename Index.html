<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Up in Lights · The Studio Journey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&display=swap">
<style>
:root{--ink:#2b3a40;--paper:rgba(255,252,243,.78);--paper2:rgba(255,252,243,.94);--acc:#9c3d2a;--gold:#f2d28b;--mint:#a8d8c8;--lav:#cfc6ea;--peach:#f0bfa8;--cin:#2b3a40;--ok:#2f7d5b;--no:#b4412e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f3ecdc;--paper:rgba(22,30,36,.72);--paper2:rgba(22,30,36,.92);--acc:#f2a38d;--ok:#7fd1a6;--no:#f2a38d;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f3ecdc;--paper:rgba(22,30,36,.72);--paper2:rgba(22,30,36,.92);--acc:#f2a38d;--ok:#7fd1a6;--no:#f2a38d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#14181f;color:var(--ink);font-family:'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100,'WONK' 1}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.bgl{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.2s;overflow:hidden}.bgl.on{opacity:1}
.bgl>div{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(100vh,56.25vw);transform:translate(-50%,-50%)}
.bgl.on>div{animation:breathe 40s ease-in-out infinite alternate}@keyframes breathe{to{transform:translate(-50%,-50%) scale(1.045)}}
.bgl svg{width:100%;height:100%;display:block}
.lamp{animation:lamp 3.4s ease-in-out infinite}@keyframes lamp{50%{opacity:.72}}
#scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(255,250,240,0),rgba(15,20,30,.34))}
#fx{position:fixed;inset:0;pointer-events:none;z-index:2}
#dark{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.4s;background:radial-gradient(ellipse at 50% 58%,rgba(0,0,0,0) 0,rgba(5,8,18,.55) 42%,rgba(5,8,18,.94))}
#beam{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0}
.cone{position:absolute;left:50%;top:-4%;width:92vmin;height:108%;transform:translateX(-50%);background:linear-gradient(rgba(255,246,200,.8),rgba(255,246,200,.1) 92%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(5px)}
.pool{position:absolute;left:50%;bottom:7%;width:70vmin;height:14vmin;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,242,184,.7),rgba(255,242,184,0) 70%)}
body.stage #dark{opacity:1}body.stage #beam.on{opacity:1;animation:flick 1.4s}
@keyframes flick{0%{opacity:0}8%{opacity:.9}14%{opacity:.1}22%{opacity:.8}30%{opacity:0}46%{opacity:1}56%{opacity:.5}100%{opacity:1}}
.cur{display:none;position:fixed;top:0;bottom:0;width:50%;z-index:5;pointer-events:none;background:repeating-linear-gradient(90deg,#4d1a26,#7b2d3b 5%,#4d1a26 10%);box-shadow:0 0 60px rgba(0,0,0,.6);transition:transform 2s cubic-bezier(.6,0,.2,1)}
body.stage .cur{display:block}.cur.l{left:0}.cur.r{right:0}.cur.l.open{transform:translateX(-82%)}.cur.r.open{transform:translateX(82%)}
#page{position:fixed;inset:0;z-index:6;display:flex;justify-content:center;align-items:center;overflow-y:auto;padding:calc(88px + env(safe-area-inset-top,0px)) 4vw calc(78px + env(safe-area-inset-bottom,0px))}
.pg{width:100%;max-width:1060px;margin:auto;transition:opacity .35s,transform .35s,filter .35s}.pg.out{opacity:0;transform:translateX(-30px);filter:blur(6px)}
h1{font-size:clamp(26px,3.2vw + 1.6vmin,46px);font-weight:800;letter-spacing:-.015em;line-height:1.08;text-shadow:0 2px 18px rgba(255,255,255,.4)}
.ins{font-style:italic;font-size:clamp(14px,1vw + 1.2vmin,19px);margin:6px 0 clamp(12px,2.2vmin,20px);opacity:.9}
body.dk h1,body.dk .ins{color:#fff4dc;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.kick{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--acc);margin-bottom:5px}
.grid{display:grid;gap:clamp(10px,1.5vmin,16px)}.g1{grid-template-columns:1fr}.g2{grid-template-columns:1fr 1fr}
.tile{position:relative;border-radius:18px;padding:clamp(12px,2vmin,20px) clamp(14px,2.4vmin,24px);background:var(--paper);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid rgba(255,255,255,.45);box-shadow:0 12px 32px rgba(15,25,35,.2);font-size:clamp(15px,1vw + 1.3vmin,20px);line-height:1.35;animation:rise .8s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:var(--d,0s)}
.tile.span{grid-column:1/-1}
.tile.g,.chip,.bk.f{background:var(--gold);color:var(--cin)}.tile.m{background:rgba(168,216,200,.88);color:var(--cin)}.tile.p{background:rgba(240,191,168,.9);color:var(--cin)}.tile.l{background:rgba(207,198,234,.92);color:var(--cin)}
.tile.g .kick,.tile.m .kick,.tile.p .kick,.tile.l .kick{color:#7a2d1f}.tile b.n{font-size:1.5em;color:var(--acc);margin-right:.4em}.tile.g b.n,.tile.m b.n,.tile.p b.n,.tile.l b.n{color:#7a2d1f}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.flip{padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none;perspective:900px;cursor:pointer;min-height:clamp(96px,19vmin,150px)}
.fl{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}.flip.on .fl{transform:rotateY(180deg)}
.fr,.bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:clamp(12px,2vmin,20px) clamp(14px,2.4vmin,24px);display:flex;flex-direction:column;justify-content:center;box-shadow:0 12px 32px rgba(15,25,35,.2);border:1px solid rgba(255,255,255,.45)}
.fr{background:var(--paper2)}.bk{background:var(--gold);color:var(--cin);transform:rotateY(180deg);font-weight:700}.flip.m .fr{background:rgba(168,216,200,.94);color:var(--cin)}.flip.g .fr{background:var(--gold);color:var(--cin)}
.btn{display:inline-block;padding:11px 26px;border-radius:999px;background:#c8624a;color:#fff;font-weight:800;font-size:clamp(14px,1vw + 1vmin,18px);box-shadow:0 10px 24px rgba(120,40,20,.35);transition:transform .2s}.btn:hover{transform:translateY(-2px) scale(1.04)}.btn.sm{padding:8px 18px;font-size:14px}
.pill{display:inline-block;padding:6px 16px;border-radius:999px;background:var(--gold);color:var(--cin);font-weight:700;font-size:clamp(12px,.9vw + 1vmin,16px);margin:4px 6px 4px 0}
/* meter */
.meter{position:relative;margin:4px 0 22px}.mb{height:12px;border-radius:99px;background:linear-gradient(90deg,#b4412e,#e0a24a 45%,#8fc79a);box-shadow:0 4px 14px rgba(0,0,0,.25);margin:0 4% 0}
.ml{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 4% 8px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.4vmin,14px);margin-top:-6px}
.sl{position:relative;min-height:clamp(84px,14vmin,118px);border-radius:16px;border:2px dashed rgba(47,62,70,.5);background:rgba(255,252,243,.4);display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.sl:before{content:attr(data-n);position:absolute;left:-6px;top:-12px;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:2}
.sl.hot{background:rgba(242,210,139,.7);transform:scale(1.04)}.sl .fc{width:100%;height:100%;margin:0}
.fpool{display:flex;gap:clamp(8px,1.4vmin,14px);flex-wrap:wrap;justify-content:center;min-height:90px}
.fc{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;flex:1 1 200px;max-width:260px;border-radius:14px;background:var(--gold);color:var(--cin);padding:12px 14px;text-align:center;font-weight:700;font-size:clamp(13px,.9vw + 1.1vmin,18px);box-shadow:0 8px 20px rgba(15,25,35,.25);display:flex;align-items:center;justify-content:center;animation:rise .7s backwards;animation-delay:var(--d)}
.fc.drag{position:fixed;z-index:50;cursor:grabbing;transform:rotate(-3deg) scale(1.06);box-shadow:0 18px 40px rgba(0,0,0,.4);animation:none;max-width:240px}
#pop{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,15,25,.38);animation:fade .25s}@keyframes fade{from{opacity:0}}
#pop .pc2{max-width:min(560px,88vw);background:var(--paper2);border-radius:22px;padding:26px 32px;box-shadow:0 24px 60px rgba(0,0,0,.45);font-size:clamp(17px,1.3vw + 1.4vmin,25px);line-height:1.35;text-align:center;animation:bubble .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bubble{from{transform:scale(.4);opacity:0}}#pop b.big{display:block;font-size:1.15em;margin-bottom:8px}#pop p{font-size:.85em;font-style:italic}#pop mark{background:var(--gold);color:var(--cin);padding:0 4px;border-radius:4px;font-style:normal;font-weight:700}
/* mind map */
.mms{display:flex;gap:clamp(8px,2vw,24px)}.mm{position:relative;flex:1;height:clamp(300px,58vh,520px)}.mm svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mm line{stroke:rgba(43,58,64,.55);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s forwards}@keyframes draw{to{stroke-dashoffset:0}}
.mc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 26px;border-radius:50%;background:#c8624a;color:#fff;font-weight:900;font-size:clamp(20px,2.4vw,34px);letter-spacing:.06em;box-shadow:0 10px 30px rgba(120,40,20,.4);animation:bubble .7s backwards;z-index:2}
.mn{position:absolute;transform:translate(-50%,-50%);padding:9px 18px;border-radius:999px;background:var(--gold);color:var(--cin);font-weight:800;font-size:clamp(13px,1vw + 1vmin,19px);box-shadow:0 8px 20px rgba(15,25,35,.28);white-space:nowrap;animation:bubble .6s cubic-bezier(.3,1.6,.5,1) backwards;transition:filter .2s;z-index:2}.mn:hover{filter:brightness(1.1) saturate(1.2)}
/* cards */
.cards{display:flex;justify-content:center;gap:clamp(6px,1.6vmin,16px);perspective:1100px;margin:6px 0 clamp(14px,2.6vmin,24px);flex-wrap:wrap}
.pc{width:clamp(96px,13vw,160px);aspect-ratio:5/7;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1);cursor:pointer;animation:deal .6s backwards;animation-delay:var(--d)}
.pc.on{transform:rotateY(180deg) translateY(-10px)}.sh .pc{animation:shuf 1s ease-in-out}
@keyframes shuf{0%{transform:none}40%{transform:translate(var(--x),var(--y)) rotate(var(--rt))}100%{transform:none}}@keyframes deal{from{opacity:0;transform:translateY(-40px) rotate(-8deg)}}
.cf,.cb{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 10px 26px rgba(0,0,0,.35);overflow:hidden}
.cf{transform:rotateY(180deg);background:#f7f0dd}.cf svg,.cb svg{position:absolute;inset:0;width:100%;height:100%}
.cf .tx{position:absolute;inset:24% 12%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(10.5px,.8vw + .6vmin,15px);line-height:1.25;color:#2b3a40;font-weight:500}.cf .tx b{color:#a53a22}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:clamp(10px,2vmin,18px)}.steps .tile{padding:10px 14px;font-size:clamp(12px,.8vw + 1vmin,16px);font-weight:600}
/* choices, rows, inputs */
.opt{cursor:pointer;transition:transform .2s,box-shadow .2s,background .3s}.opt:hover{transform:translateY(-2px)}.opt.sel{outline:3px solid #c8624a}.opt.right{background:rgba(143,199,154,.95);color:var(--cin);outline:3px solid var(--ok)}.opt.wrong{background:rgba(240,191,168,.95);color:var(--cin)}
.who{display:flex;gap:6px;margin-top:8px}.who button{width:38px;height:34px;border-radius:10px;background:rgba(43,58,64,.12);font-weight:800}.who button.s{background:#c8624a;color:#fff}.who button.rt{background:var(--ok);color:#fff}.who button.wr{background:var(--no);color:#fff}
.sn{cursor:pointer;margin-bottom:clamp(6px,1vmin,10px);font-size:clamp(13px,.8vw + 1.1vmin,18px)!important;padding:clamp(8px,1.4vmin,14px) 16px!important}
mark{background:linear-gradient(transparent 55%,transparent 55%);background-size:0 100%;background-repeat:no-repeat;color:inherit;border-radius:3px;padding:0 3px;transition:background-size .7s}.hl mark,mark.on{background-image:linear-gradient(#f6d663,#f6d663);background-size:100% 100%;font-weight:800;color:#2b3a40}
.ex{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(10px,1.6vmin,16px);align-items:start}
.qr{margin-bottom:clamp(8px,1.3vmin,12px)}.qh{padding:9px 16px!important;font-size:clamp(13px,.85vw + 1.1vmin,18px)!important}
.qi{display:flex;gap:8px;margin-top:6px}.qi input{flex:1;min-width:0;padding:10px 16px;border-radius:14px;border:2px solid rgba(47,62,70,.3);background:var(--paper2);font-size:clamp(14px,.9vw + 1vmin,18px);outline:none}.qi input:focus{border-color:#c8624a}
.res{display:none;margin-top:6px;border-radius:14px;padding:8px 14px;font-size:clamp(13px,.8vw + 1vmin,17px);line-height:1.4;background:var(--paper2)}.res.ok,.res.near,.res.no{display:block;animation:rise .4s}.res.ok{border-left:6px solid var(--ok)}.res.near{border-left:6px solid #d9a03a}.res.no{border-left:6px solid var(--no)}
.res del{color:var(--no);text-decoration:line-through}.res ins{color:var(--ok);font-weight:800;text-decoration:underline}.res .md{display:block;margin-top:4px;font-style:italic;opacity:.9}.ico{width:1.1em;height:1.1em;vertical-align:-.18em;margin-right:6px}
/* cleft */
.cl{display:flex;flex-direction:column;gap:clamp(6px,1.2vmin,12px)}.stp{position:relative;padding:12px 16px 12px 58px!important}.stp .no{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.stp .lab{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}.sen{display:flex;flex-wrap:wrap;gap:6px;font-weight:700}.bk2{padding:4px 12px;border-radius:10px}.bk2.f{background:var(--gold);color:var(--cin)}.bk2.r{background:rgba(240,191,168,.95);color:var(--cin)}.bk2.c{background:var(--lav);color:var(--cin)}.bk2.d{background:rgba(43,58,64,.14)}
.dn{align-self:center;width:0;height:0;border:11px solid transparent;border-top:15px solid #c8624a;animation:rise .6s backwards;animation-delay:var(--d);filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.leg{animation:rise .6s backwards;animation-delay:var(--d);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px;font-weight:700}
/* board */
.ab{display:flex;align-items:center;gap:10px;font-weight:900;margin-bottom:8px;font-size:20px}.ab i{flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,#c8624a,transparent);position:relative}.ab i:after{content:"";position:absolute;right:0;top:-5px;border:6px solid transparent;border-left:10px solid #c8624a}
.bd{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(5px,.9vmin,9px)}
.cell{position:relative;border-radius:12px;padding:6px 8px;min-height:clamp(52px,9.2vmin,76px);display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(10px,.7vw + .9vmin,15px);line-height:1.15;color:var(--cin);cursor:pointer;animation:rise .6s backwards;animation-delay:var(--d);transition:transform .2s,opacity .3s,box-shadow .3s}
.cell.nx{box-shadow:0 0 0 3px #fff,0 0 18px 4px rgba(242,210,139,.95);animation:rise .6s backwards,nx 1.4s infinite}@keyframes nx{50%{transform:scale(1.05)}}
.cell.sel{box-shadow:inset 0 0 0 4px #c8624a;font-weight:800}.cell .bdg{position:absolute;right:-6px;top:-8px;width:26px;height:26px;border-radius:50%;background:#c8624a;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;animation:bubble .4s}
.tm{position:fixed;right:max(12px,1.6vw);top:50%;transform:translateY(-50%);z-index:8;text-align:center}.tm svg{width:92px;height:92px;display:block}.tm button{margin-top:6px;font-size:12px;background:var(--paper2);padding:5px 12px;border-radius:999px;font-weight:700}
.set{display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}.set .tile{display:flex;align-items:center;gap:14px;cursor:pointer;font-size:clamp(16px,1.2vw + 1.3vmin,24px);font-weight:700}.set .tile.done{opacity:.55;text-decoration:line-through}
.stg{text-align:center}.stg h1{color:#fff3c8;text-shadow:0 0 40px rgba(255,220,130,.8)}.stg .ins{color:#f6ebd0}
/* title */
#title{position:fixed;inset:0;z-index:7;overflow:hidden;transition:opacity .8s}#title>#tsc{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(100vh,56.25vw);transform:translate(-50%,-50%)}
#title.enter>#tsc{transition:transform 2.3s cubic-bezier(.65,0,.35,1);transform:translate(-50%,-50%) scale(9)}#title svg{width:100%;height:100%;display:block}
#title .tt{position:fixed;left:5vw;top:9vh;max-width:min(520px,80vw);z-index:3;transition:opacity .6s}#title.enter .tt{opacity:0}#title .tt h1{font-size:clamp(40px,7vw,92px);color:#2b3a40}
.dr{position:absolute;cursor:pointer;perspective:500px;animation:hint 2.2s infinite;border-radius:48px 48px 4px 4px}@keyframes hint{50%{filter:drop-shadow(0 0 16px #ffe9a0)}}
.dr i{position:absolute;top:0;bottom:0;width:50%;background:#7a4a35 repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 10px);transition:transform 1.1s cubic-bezier(.5,0,.2,1)}.dr i:first-child{left:0;transform-origin:left;border-radius:48px 0 0 4px}.dr i:last-child{right:0;transform-origin:right;border-radius:0 48px 4px 0}
.dr.open i:first-child{transform:rotateY(-110deg)}.dr.open i:last-child{transform:rotateY(110deg)}.dr:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 70%,#fff4c8,#f2c566);z-index:-1}
#flash{position:fixed;inset:0;z-index:30;background:#fff4d0;opacity:0;pointer-events:none;transition:opacity 1s}#flash.on{opacity:1}
/* hud */
#hud{position:fixed;top:0;left:0;right:0;z-index:9;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;flex-direction:column;align-items:center;pointer-events:none;transition:opacity .5s}#hud.hide{opacity:0}
.path{position:relative;display:flex;width:min(540px,70vw);justify-content:space-between;align-items:center}.path:before{content:"";position:absolute;left:12px;right:12px;top:50%;height:2px;background:rgba(255,255,255,.7)}
.nd{position:relative;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.85);color:#2b3a40;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:background .4s,transform .4s}.nd.v{background:#f2d28b}.nd.c{background:#fff3c4;transform:scale(1.35);box-shadow:0 0 0 6px rgba(255,236,170,.45),0 0 22px #ffe9a0}
.rn{margin-top:6px;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.hb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:10;display:flex;gap:8px;pointer-events:auto}.ib{height:36px;padding:0 14px;border-radius:999px;background:var(--paper2);font-weight:700;font-size:13px;box-shadow:0 6px 16px rgba(15,25,35,.25)}
