<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagon Alley English</title>
<link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0c0a22;--bg2:#2b1a4d;--panel:rgba(24,19,54,.84);--ink:#f3ead2;--mut:#bdb4d8;--line:rgba(232,195,106,.4);--gold:#e8c36a;--ok:#6fe0a0;--bad:#ff8a7a;--cob1:#3d3556;--cob2:#2b2540;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#f3e9d2;--bg2:#cdbde8;--panel:rgba(255,251,240,.92);--ink:#2a1d12;--mut:#625374;--line:rgba(120,84,20,.45);--gold:#8a5a00;--ok:#1f7a45;--bad:#b3261e;--cob1:#a89c86;--cob2:#8c8068}}
:root[data-theme="light"]{--bg1:#f3e9d2;--bg2:#cdbde8;--panel:rgba(255,251,240,.92);--ink:#2a1d12;--mut:#625374;--line:rgba(120,84,20,.45);--gold:#8a5a00;--ok:#1f7a45;--bad:#b3261e;--cob1:#a89c86;--cob2:#8c8068}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg1) linear-gradient(170deg,var(--bg1),var(--bg2));color:var(--ink);font:500 1.25rem/1.5 'Cormorant Garamond',Georgia,serif}
.wand-on,.wand-on *{cursor:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#wand{position:fixed;left:0;top:0;width:56px;height:56px;pointer-events:none;z-index:60;display:none;will-change:transform}.wand-on #wand{display:block}
#app{position:relative;max-width:900px;margin:0 auto;padding:12px 14px 40px}

h1{font-size:clamp(1.6rem,5vw,2.4rem);text-align:center;background:linear-gradient(90deg,var(--gold),var(--ink),var(--gold));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
h2{font-size:1.4rem;color:var(--gold)}
@keyframes shine{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.slide{animation:rise .5s ease both}
.sw{overflow-x:auto;padding-top:6px}
.street{display:flex;gap:8px;align-items:flex-end;min-width:620px}
.shop{flex:1 0 112px;background:none;border:0;padding:0;min-height:0;text-align:center;transform:rotate(var(--r));box-shadow:none}
.shop:hover:not(:disabled){transform:rotate(var(--r)) translateY(-4px);box-shadow:none}
.roof{display:block;height:16px;background:var(--roof);clip-path:polygon(0 100%,8% 0,92% 0,100% 100%)}
.sign{display:block;background:#3b2515;color:#f0d28a;border:1px solid #c9a24f;font:700 .92rem 'Cormorant Garamond',Georgia,serif;padding:2px 4px;line-height:1.2}
.win{display:block;height:46px;line-height:46px;font-size:1.6rem;background:linear-gradient(#262050,#171232);border:3px solid #3b2515;border-top:0;transition:box-shadow .3s}
.on .win{background:radial-gradient(circle,#ffe29a,#e08a2e);box-shadow:0 0 24px #ffb84a}
.shop small{display:block;color:var(--mut);font:.72rem system-ui,sans-serif;padding-top:3px}

button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.6;cursor:default}
.pri,.sel{background:var(--gold);color:#1a1230;border-color:var(--gold)}
.foot{display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.mut{color:var(--mut);font-size:1.05rem;margin:6px 0 0}
.tip{font:.85rem system-ui,sans-serif;color:var(--mut)}
.chip{display:inline-block;font:600 .85rem system-ui,sans-serif;background:#5a3fc0;color:#fff;padding:3px 12px;border-radius:99px}
.big{font-size:1.45rem;margin:10px 0 0}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.grid button{text-align:left}
.opts{display:grid;gap:10px;margin-top:12px}.opts button{text-align:left}
.ok{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 22%,var(--panel))!important}
.no{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 22%,var(--panel))!important}
.fb{margin-top:12px;padding:10px 14px;border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);font-size:1.05rem}
input[type=text]{width:100%;font:1.1rem system-ui,sans-serif;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);margin-top:10px}
video{width:100%;max-height:60vh;background:#000;border-radius:12px;margin-top:10px}
.scene{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.scene input{width:84px;margin:0;text-align:center}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}

#scene{position:fixed;inset:0;z-index:1;overflow:hidden;background:linear-gradient(#090720 0%,#2b1a4d 50%,#7a3f5c 100%);touch-action:none;user-select:none;transition:transform .5s ease,opacity .5s ease}

#scene.flash{animation:flash 1.8s ease-out}
@keyframes flash{from{filter:brightness(3)}}
.moon{position:absolute;top:7%;right:10%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe6,#e8dca8);box-shadow:0 0 70px #fff3b0}

@keyframes fly{to{transform:translateX(110vw) translateY(-30px)}}
#far,#near{position:absolute;left:0;bottom:0;will-change:transform}
#far{height:60%;width:3400px;bottom:80px}#near{height:100%;width:2900px}

.ground{position:absolute;left:0;right:0;bottom:0;height:90px;background:repeating-linear-gradient(90deg,#3d3556 0 38px,#2b2540 38px 42px),#2b2540;box-shadow:inset 0 10px 20px rgba(0,0,0,.5)}
.bd{position:absolute;bottom:90px;background:var(--c);clip-path:polygon(0 7%,50% 0,100% 7%,100% 100%,0 100%)}

.next .sign{animation:glow 2s infinite}

{t:'learn',g:'Scene 2: the hut',s:`Hagrid turned up at midnight and broke the news that Harry was a wizard.`,r:`turn up = arrive unexpectedly. break the news (that…) = tell someone important information. Reporting verbs: insist on + -ing, refuse to + infinitive, warn somebody (not) to + infinitive.`},

{t:'speak',g:'Narrative and reported speech',q:`Retell the hut scene as if you were Harry telling a friend. Use reported speech and at least two of: turn up, break the news, take it in.`,m:`I had spent my whole life believing I was ordinary. Then a giant turned up at midnight and broke the news that I was a wizard. He said my parents had been wizards too, and I could hardly take it in.`,tip:'Giáo viên: chú ý lùi thì trong câu gián tiếp, sửa sau khi nói xong.'},
{t:'learn',g:'Scene 3: the wand shop',s:`Wands are said to choose their owners, not the other way round.`,r:`Passive reporting: It is said that… = X is said to + infinitive. Defining relative clauses: a wand that / which…, a customer who…, a shop whose…`},
{t:'mc',g:'Passive reporting',q:`A wand is said ___ its owner, not the other way round.`,o:['to choose','choosing','to have choose','chose'],a:0,e:'X is said to + infinitive.'},
{t:'mc',g:'Relative clauses',q:`The shopkeeper remembered every wand ___ he had ever sold.`,o:['that','what','whose','who'],a:0,e:'that / which for things in a defining relative clause.'},
{t:'learn',g:'Scene 4: the train',s:`Harry and Ron hit it off straight away, while Draco looked down on them both.`,r:`hit it off = quickly become friends. look down on = think you are better than. run into = meet by chance. Past perfect for first-time experiences: had never + past participle.`},
{t:'mc',g:'Phrasal verb: hit it off',q:`Harry and Ron ___ it off almost immediately.`,o:['hit','got','made','took'],a:0,e:'hit it off = become friends quickly.'},
{t:'listen',g:'Past perfect',s:`Until that day, Harry had never made a real friend.`,d:`Until that day, Harry ___ a real friend.`,a:['had never made']},

{t:'mc',g:'Phrasal verb: fit in',q:`Harry worried he wouldn't ___ in at Hogwarts.`,o:['fit','stand','take','put'],a:0,e:'fit in = be accepted by a group.'},

{t:'speak',g:'Third conditional and wish',q:`Which house would your colleagues put you in, and which would you choose yourself? Use a third conditional or "wish", plus fit in, stand out or end up.`,m:`My colleagues would probably put me in Ravenclaw because I stand out as the one who asks too many questions. If I had been given the choice, I might have ended up in Hufflepuff, where I'd fit in more easily.`,tip:'Giáo viên: khuyến khích câu điều kiện loại 3 hoặc wish + had + V3.'}];

$('gm').innerHTML=`<div class="pn"><h2>Ollivanders</h2><div class="tip" style="display:flex;justify-content:space-between"><span>Card ${gi+1} of ${C.length}</span><b id="sc">💰 ${pts} galleons</b></div><div class="bar"><i style="width:${gi/C.length*100}%"></i></div></div><div class="pn"><span class="chip">${c.g}</span>${b}<div id="fb"></div><div class="row"><button class="pri hidden" id="bn" onclick="gi++;gShow()">Next card</button></div></div>`;

x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill();});requestAnimationFrame(f);})(0);})();

/* Sound: all synthesized in the browser */
let AC=null,mg,mus,mOn=true,mst=false;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.6;mg.connect(AC.destination);mus=AC.createGain();mus.gain.value=.09;const dl=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter();dl.delayTime.value=.42;fb.gain.value=.38;lp.type='lowpass';lp.frequency.value=1800;mus.connect(mg);mus.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(mg);}catch(e){AC=null;}}return AC;}
function tone(f,t,d,ty,v,o2){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(o2||mg);o.start(t);o.stop(t+d+.05);}
function noise(t,d,f0,f1,v){const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type='bandpass';fl.Q.value=2;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(mg);s.start(t);}
const SFX={click:t=>tone(1100,t,.05,'square',.05),
wand:t=>{noise(t,.3,500,6000,.22);[1568,2093,2637].forEach((f,i)=>tone(f,t+.1+i*.06,.3,'sine',.06));},
knock:t=>{tone(120,t,.2,'sine',.55);tone(75,t,.22,'triangle',.4);noise(t,.05,400,200,.25);},
door:t=>{tone(2400,t,.025,'square',.07);noise(t,.03,3500,1500,.18);tone(1500,t+.07,.03,'square',.06);noise(t+.07,.04,2500,900,.2);const t0=t+.16,o=AC.createOscillator(),am=AC.createOscillator(),ag=AC.createGain(),bp=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(420,t0);o.frequency.linearRampToValueAtTime(620,t0+.5);o.frequency.linearRampToValueAtTime(380,t0+1);am.type='square';am.frequency.value=34;ag.gain.value=.035;am.connect(ag);ag.connect(g.gain);bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=5;g.gain.setValueAtTime(.04,t0);g.gain.linearRampToValueAtTime(.06,t0+.5);g.gain.linearRampToValueAtTime(.0001,t0+1.05);o.connect(bp);bp.connect(g);g.connect(mg);o.start(t0);am.start(t0);o.stop(t0+1.1);am.stop(t0+1.1);noise(t0,.9,200,500,.08);tone(85,t0+1.05,.3,'sine',.4);tone(60,t0+1.05,.3,'triangle',.3);noise(t0+1.05,.06,600,250,.22);},
door0:t=>{tone(1800,t,.03,'square',.08);noise(t,.04,2500,900,.2);const o=AC.createOscillator(),lf=AC.createOscillator(),lg=AC.createGain(),bp=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(190,t+.08);o.frequency.linearRampToValueAtTime(330,t+.5);o.frequency.linearRampToValueAtTime(240,t+.9);lf.frequency.value=17;lg.gain.value=22;lf.connect(lg);lg.connect(o.frequency);bp.type='bandpass';bp.frequency.value=900;bp.Q.value=6;g.gain.setValueAtTime(.0001,t+.08);g.gain.linearRampToValueAtTime(.07,t+.25);g.gain.linearRampToValueAtTime(.05,t+.65);g.gain.exponentialRampToValueAtTime(.0001,t+.95);o.connect(bp);bp.connect(g);g.connect(mg);o.start(t+.08);lf.start(t+.08);o.stop(t+1);lf.stop(t+1);noise(t+.1,.7,150,350,.1);tone(95,t+.95,.25,'sine',.35);noise(t+.95,.08,500,200,.2);},
wall:t=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(80,t);o.frequency.linearRampToValueAtTime(150,t+.6);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.09,t+.1);g.gain.exponentialRampToValueAtTime(.0001,t+.7);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.75);noise(t,.5,200,900,.12);},
bad:t=>{tone(180,t,.25,'sawtooth',.07);tone(140,t+.1,.3,'sawtooth',.07);}};
