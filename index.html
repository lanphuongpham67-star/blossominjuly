<script>
const $=id=>document.getElementById(id),W=()=>innerWidth,H=()=>innerHeight;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),rnd=(a,b)=>a+Math.random()*(b-a);
const TOPICS=[
{t:'Joining a new team',q:'Describe a time you had to fit into a new team. What helped, and what would you do differently?',u:'third conditional, end up, hit it off'},
{t:'A hidden talent',q:'What skill did you not know you had until someone pointed it out?',u:'past perfect, it turned out that…'},
{t:'Fame or freedom',q:'Would you rather be famous for something you did not choose, or unknown but doing what you love?',u:'would rather… than…'},
{t:'A mentor',q:'Who gave you the best advice at work or in life? How did you take it?',u:'reporting verbs, insist on, warn'},
{t:'Magic at the office',q:'If you could add one piece of magic to everyday office life, what would it be?',u:'second conditional, I wish…'}];
let bag=[],st='closed',fx=0,fy=0,fvis=false,air=false,run=0,dirn=1,cur=null,snd=true,AC=null,nx=0,ny=0,lock=false;
const nextTopic=()=>{if(!bag.length)bag=TOPICS.map((_,i)=>i).sort(()=>Math.random()-.5);return TOPICS[bag.pop()];};
/* sound: tiny synthesized effects */
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC;}
function tone(f1,f2,d,type,v){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);}
function noise(d,f0,f1,v){const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type='bandpass';fl.Q.value=1.5;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t);}
function sfx(n){if(!snd)return;try{if(n=='creak'){tone(90,170,.9,'sawtooth',.05);noise(.8,200,700,.08);}else if(n=='boing'){tone(300,640,.14,'sine',.1);}else if(n=='puff'){noise(.25,1800,400,.12);}else if(n=='swish'){noise(.28,400,3500,.13);}else if(n=='miss'){tone(260,120,.22,'triangle',.1);}else if(n=='magic'){[784,988,1318,1568].forEach((f,i)=>setTimeout(()=>tone(f,f*1.01,.35,'sine',.07),i*90));}}catch(e){}}
/* frog */
const fw=()=>$('frog').offsetWidth,fh=()=>$('frog').offsetHeight;
const tr=(x,y,sx,sy,r)=>`translate(${x-fw()/2}px,${y-fh()}px) scale(${sx},${sy}) rotate(${r}deg)`;
function setFrog(x,y,sx=1,sy=1,r=0){fx=x;fy=y;$('frog').style.transform=tr(x,y,sx,sy,r);}
function puff(x,y,n=12){const s=$('stage');for(let i=0;i<n;i++){const e=document.createElement('div');e.className='sp'+(i%3==0?' cloud':'');const a=Math.random()*6.28,d=rnd(30,90);e.style.left=x+'px';e.style.top=y+'px';s.appendChild(e);const an=e.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d-8}px,${Math.sin(a)*d-8}px) scale(.2)`,opacity:0}],{duration:rnd(400,700),easing:'ease-out'});an.onfinish=()=>e.remove();}}
function hop(x1,y1,arc,dur){return new Promise(res=>{const x0=fx,y0=fy,dir=x1>=x0?1:-1,xm=(x0+x1)/2,ym=Math.min(y0,y1)-arc;dirn=dir;const f=$('frog');air=true;setFrog(x1,y1,dir,1,0);
const a=f.animate([{transform:tr(x0,y0,dir*1.1,.84,0),offset:0},{transform:tr(x0,y0,dir*.9,1.14,0),offset:.12},{transform:tr(xm,ym,dir*.96,1.08,dir*-8),offset:.5},{transform:tr(x1,y1,dir*.95,1.1,dir*6),offset:.86},{transform:tr(x1,y1,dir*1.12,.82,0),offset:.94},{transform:tr(x1,y1,dir,1,0),offset:1}],{duration:dur,easing:'cubic-bezier(.4,.1,.5,1)'});sfx('boing');a.onfinish=()=>{air=false;res();};});}
async function vanish(){const f=$('frog');puff(fx,fy-fh()/2);sfx('puff');fvis=false;const a=f.animate([{opacity:1,filter:'blur(0px)'},{opacity:0,filter:'blur(5px)'}],{duration:150,fill:'forwards'});await wait(150);f.style.opacity=0;a.cancel();}
async function appear(x,y){const f=$('frog');dirn=Math.random()<.5?1:-1;setFrog(x,y,dirn,1,0);f.style.opacity=1;fvis=true;puff(x,y-fh()/2,10);sfx('puff');f.animate([{opacity:0,transform:tr(x,y,dirn*.3,.3,0)},{opacity:1,transform:tr(x,y,dirn*1.12,.9,0),offset:.7},{opacity:1,transform:tr(x,y,dirn,1,0)}],{duration:200});}
function spot(){const w=W(),h=H(),r=$('boxFront').getBoundingClientRect();for(let i=0;i<30;i++){const x=rnd(w*.1,w*.9),y=rnd(h*.34,h*.8);const inBox=x>r.left-fw()*.6&&x<r.right+fw()*.6&&y>r.top-h*.02;if(!inBox&&Math.hypot(x-fx,y-fy)>w*.14)return[x,y];}return[w*.2,h*.55];}
async function hunt(){const id=++run,alive=()=>st=='hunt'&&id==run;while(alive()){let p=spot();await hop(p[0],p[1],rnd(60,120),rnd(300,420));if(!alive())break;await wait(rnd(170,330));if(!alive())break;await vanish();await wait(rnd(110,280));if(!alive())break;p=spot();await appear(p[0],p[1]);await wait(rnd(300,560));}}
/* net: the player moves it and scoops */
function moveNet(x,y){nx=x;ny=y;const w=$('net').offsetWidth;$('net').style.transform=`translate(${x-w*.296}px,${y-w*.296}px)`;}
function floatText(txt,x,y){const e=document.createElement('div');e.className='miss';e.textContent=txt;e.style.left=x+'px';e.style.top=y+'px';$('stage').appendChild(e);const a=e.animate([{opacity:1,transform:'translate(-50%,-50%)'},{opacity:0,transform:'translate(-50%,-190%)'}],{duration:700,easing:'ease-out'});a.onfinish=()=>e.remove();}
function scoop(){if(st!='hunt'||lock)return;lock=true;setTimeout(()=>{lock=false;},360);const w=$('net').offsetWidth,ring=w*.23;
$('net').firstElementChild.animate([{transform:'rotate(0deg) scale(1)'},{transform:'rotate(-16deg) scale(1.12)',offset:.35},{transform:'rotate(10deg) scale(.92)',offset:.7},{transform:'rotate(0deg) scale(1)'}],{duration:300,easing:'ease-out'});sfx('swish');
const hit=fvis&&!air&&Math.hypot(fx-nx,(fy-fh()*.45)-ny)<ring+fw()*.2;if(hit)catchIt();else{sfx('miss');floatText('Missed!',nx,ny-ring);}}
async function openBox(){if(st!='closed')return;ac();st='opening';cur=nextTopic();$('open').style.display='none';$('hint').textContent='';$('stage').classList.add('open');sfx('creak');
const r=$('boxFront').getBoundingClientRect(),bx=r.left+r.width/2,by=r.top+r.height*(216/420),f=$('frog');setFrog(bx,by,1,1,0);
await wait(650);f.style.opacity=1;fvis=true;puff(bx,by-fh()*.5,14);sfx('magic');await wait(450);
const p=spot();await hop(p[0],p[1],Math.min(H()*.34,240),700);st='hunt';$('stage').classList.add('hunt');$('hint').textContent='Quick! Move the net over the frog and click (or tap).';$('net').style.display='block';moveNet(nx||W()/2,ny||H()*.5);hunt();}
async function catchIt(){st='catching';run++;$('stage').classList.remove('hunt');$('hint').textContent='';const n=$('net'),tx=nx,ty=ny;
const a=n.firstElementChild.animate([{transform:'scale(1)'},{transform:'scale(.86)'}],{duration:220,fill:'forwards'});await wait(200);if(fvis)await vanish();await wait(150);a.cancel();n.style.display='none';
$('ctag').textContent='Not the frog… you caught a question!';$('ct').textContent=cur.t;$('cq').textContent=cur.q;$('cu').textContent='Try to use: '+cur.u;const c=$('card');c.style.display='flex';sfx('magic');puff(W()/2,H()/2,22);
c.animate([{transform:`translate(${tx-W()/2}px,${ty-H()/2}px) scale(.1) rotate(-20deg)`,opacity:0},{transform:'none',opacity:1}],{duration:700,easing:'cubic-bezier(.2,1.2,.4,1)'});st='done';}
async function again(){if(st!='done')return;$('card').style.display='none';$('stage').classList.remove('open');$('hint').textContent='Open the box and see who jumps out.';$('frog').style.opacity=0;fvis=false;await wait(900);st='closed';$('open').style.display='';}
$('open').onclick=openBox;$('again').onclick=again;
$('mute').onclick=()=>{snd=!snd;$('mute').textContent=snd?'🔊':'🔇';};
addEventListener('pointermove',e=>{if(st=='hunt')moveNet(e.clientX,e.clientY);});
$('stage').addEventListener('pointerdown',e=>{if(st!='hunt'||e.target.closest('button'))return;moveNet(e.clientX,e.clientY);scoop();});
addEventListener('keydown',e=>{const k=e.code;if(k=='Space'&&!e.repeat){e.preventDefault();if(st=='closed')openBox();else if(st=='hunt')scoop();else if(st=='done')again();}
else if(st=='hunt'&&k.startsWith('Arrow')){e.preventDefault();const d=48;moveNet(Math.max(0,Math.min(W(),nx+(k=='ArrowRight'?d:k=='ArrowLeft'?-d:0))),Math.max(0,Math.min(H(),ny+(k=='ArrowDown'?d:k=='ArrowUp'?-d:0))));}});
</script></body></html>
